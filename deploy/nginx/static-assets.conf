# Include inside the existing HTTPS server block, whose root points to public/.
# Test with nginx -t before reloading. Keep PHP and Laravel routing in that block.
location = /assets/dried-chilli/nafu-home.js { return 301 /assets/dried-chilli/dried-chilli-home.js$is_args$args; }
location = /assets/dried-chilli/nafu-services.js { return 301 /assets/dried-chilli/dried-chilli-services.js$is_args$args; }
location = /assets/dried-chilli/nafu-logo.png { return 301 /images/logo_dried.png$is_args$args; }

location ~* \.(?:css|js|mjs|webp|avif|png|jpe?g|gif|svg|ico|woff2?|ttf|otf)$ {
    try_files $uri =404;
    expires 7d;
    access_log off;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;
