# Include inside the existing HTTPS server block, whose root points to public/.
# Test with nginx -t before reloading. Keep PHP and Laravel routing in that block.
location ~* \.(?:css|js|mjs|webp|avif|png|jpe?g|gif|svg|ico|woff2?|ttf|otf)$ {
    try_files $uri =404;
    expires 7d;
    access_log off;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;
